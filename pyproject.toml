[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "judgy_reachy_no_phone"
version = "0.1.0"
authors = [{ name = "Yasemin Ozkut", email = "ozkutyasemin@gmail.com" }]
description = "A Reachy Mini app that detects phone pickups and shames you with snarky comments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini>=1.7,<2",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "ultralytics>=8.4",
    "edge-tts>=7.0",
    "pydantic>=2.0"
]
keywords = ["reachy-mini-app", "productivity"]

[project.optional-dependencies]
llm = ["groq>=1.5"]
premium-tts = ["elevenlabs>=2.5"]

[project.entry-points."reachy_mini_apps"]
judgy_reachy_no_phone = "judgy_reachy_no_phone.main:JudgyReachyNoPhone"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
judgy_reachy_no_phone = ["**/*"] # Also include all non-.py files